<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#FFF1E6">
<title>Chúc 20/10 cho 7 chị em nè</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Nunito:wght@700;800;900&display=swap" rel="stylesheet">
<style>
:root{--plum:#4A2C5A;--plum2:#6B4A85;--line:#DCCFF5;--rose:#C2487A;--shadow:0 14px 34px -14px rgba(107,74,133,.45)}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;min-height:100vh;overflow-x:hidden;color:var(--plum);
  font:800 1rem/1.5 Nunito,ui-rounded,"SF Pro Rounded",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  background:radial-gradient(60rem 38rem at 8% -8%,#FFD6E2 0,transparent 62%),radial-gradient(50rem 38rem at 100% 4%,#E4D9FF 0,transparent 58%),radial-gradient(60rem 40rem at 50% 108%,#FFE2CC 0,transparent 62%),#FFF4EA}
main{width:min(100%,44rem);margin:0 auto;padding:28px 16px 56px}
header{text-align:center}
.bow{display:block;width:68px;height:auto;margin:0 auto 8px;transform-origin:50% 60%;animation:wig 3.6s ease-in-out infinite}
.date{display:inline-block;margin:0;padding:4px 18px;border-radius:99px;background:#fff;box-shadow:var(--shadow);color:var(--rose);font-weight:900;letter-spacing:.32em;text-indent:.32em}
h1{margin:14px 0 8px;font-size:clamp(2rem,8.4vw,3.1rem);line-height:1.15;font-weight:900;text-wrap:balance}
.sub{margin:0;color:var(--plum2);font-weight:700}
.names{display:grid;grid-template-columns:repeat(2,1fr);gap:12px;margin-top:26px}
@media(min-width:560px){.names{grid-template-columns:repeat(3,1fr)}}
button{font:inherit;color:var(--plum);-webkit-tap-highlight-color:transparent}
button:focus-visible{outline:3px solid var(--plum);outline-offset:3px}
.names button{width:100%;min-height:56px;padding:10px 12px;border:2px solid var(--line);border-radius:20px;background:rgba(255,255,255,.85);
  font-weight:900;font-size:1.08rem;cursor:pointer;box-shadow:0 6px 14px -8px rgba(107,74,133,.4);
  transition:transform .2s,box-shadow .2s,background .25s,border-color .25s}
.names button:hover{transform:translateY(-2px)}
.names button:active{transform:scale(.97)}
.names button[aria-pressed=true]{background:var(--c);border-color:var(--plum);transform:translateY(-3px) scale(1.04);box-shadow:var(--shadow)}
.card{--accent:#E4D9FF;position:relative;display:grid;place-items:center;min-height:300px;margin-top:28px;padding:40px 24px 34px;text-align:center;
  border-radius:32px;background:linear-gradient(160deg,#fff,#FFF7FB);box-shadow:0 22px 50px -22px rgba(107,74,133,.5)}
.card::before{content:"";position:absolute;inset:10px;border:2px dashed var(--accent);border-radius:24px;pointer-events:none;transition:border-color .3s}
.inner{max-width:34rem;animation:in .45s cubic-bezier(.2,.8,.2,1) both}
.ico{display:grid;place-items:center;width:88px;height:88px;margin:0 auto 14px;border-radius:50%;background:var(--accent);color:var(--rose);box-shadow:inset 0 -6px 0 rgba(255,255,255,.35)}
.ico svg{width:58px;height:58px}
.name{margin:0 0 10px;font-size:clamp(2.3rem,10vw,3.4rem);line-height:1.1;font-weight:900}
.name span{padding:0 .15em;background:linear-gradient(transparent 60%,var(--accent) 60%)}
.wish{margin:0;font-size:clamp(1.1rem,4.4vw,1.3rem);line-height:1.65;font-weight:700;text-wrap:pretty}
.hint{margin:0;font-size:clamp(1.5rem,6vw,2rem);line-height:1.25;font-weight:900}
.fx{display:flex;align-items:center;gap:10px;min-height:44px;margin:22px auto 0;padding:8px 18px;border:2px solid var(--line);border-radius:99px;background:rgba(255,255,255,.8);font-weight:900;cursor:pointer}
.fx i{position:relative;width:38px;height:22px;border-radius:99px;background:#CDBFE6;transition:background .2s}
.fx i::after{content:"";position:absolute;top:3px;left:3px;width:16px;height:16px;border-radius:50%;background:#fff;transition:transform .2s}
.fx[aria-pressed=true] i{background:var(--rose)}
.fx[aria-pressed=true] i::after{transform:translateX(16px)}
.fx b{min-width:2.2em;text-align:left}
.layer{position:fixed;inset:0;overflow:hidden;pointer-events:none;z-index:5}
.layer i{position:absolute;top:-40px;left:var(--x);width:var(--s);height:var(--s);opacity:0;animation:fall linear forwards}
.layer svg{display:block;width:100%;height:100%}
@keyframes in{from{opacity:0;transform:translateY(12px) scale(.97)}to{opacity:1;transform:none}}
@keyframes wig{0%,60%,100%{transform:rotate(0)}70%{transform:rotate(-7deg)}80%{transform:rotate(6deg)}90%{transform:rotate(-3deg)}}
@keyframes fall{0%{transform:translate3d(0,0,0) rotate(0);opacity:0}12%,85%{opacity:var(--o)}100%{transform:translate3d(var(--dx),calc(100vh + 80px),0) rotate(var(--r));opacity:0}}
@media(prefers-reduced-motion:reduce){.bow,.inner{animation:none}.names button{transition:none}}
</style>
</head>
<body>
<main>
  <header>
    <svg class="bow" viewBox="0 0 80 52" aria-hidden="true"><defs><linearGradient id="bw" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#FF9EC4"/><stop offset="1" stop-color="#C9B3FF"/></linearGradient></defs><path d="M37 30 26 48l10-4 4-12zM43 30l11 18-10-4-4-12z" fill="#FF7FA5"/><path d="M40 26C30 6 6 6 8 24c1 15 22 14 32 2z" fill="url(#bw)"/><path d="M40 26c10-20 34-20 32-2-1 15-22 14-32 2z" fill="url(#bw)"/><circle cx="40" cy="26" r="6.5" fill="#FF5C93"/></svg>
    <p class="date">20.10</p>
    <h1>Chúc 20/10 cho 6 chị em nè</h1>
    <p class="sub">Bấm tên của mình để nhận lời chúc</p>
  </header>

  <div class="names" id="names" role="group" aria-label="Chọn tên của bạn"></div>

  <section class="card" id="card" aria-live="polite"><div class="inner" id="inner"></div></section>

  <button class="fx" id="fx" type="button" aria-pressed="true">Hoa &amp; tim rơi <i aria-hidden="true"></i><b>Bật</b></button>
</main>
<div class="layer" id="layer" aria-hidden="true"></div>

<script>
const flower = (fill, core, under = '') =>
  `<svg viewBox="0 0 64 64" aria-hidden="true">${under}${[[32,17.5],[43.9,26.1],[39.3,40.1],[24.7,40.1],[20.1,26.1]]
    .map(([x, y]) => `<circle cx="${x}" cy="${y}" r="9.5" fill="${fill}"/>`).join('')}<circle cx="32" cy="30" r="6" fill="${core}"/></svg>`;
const heart = '<svg viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M12 21s-8-4.9-8-10.6C4 7.4 6.1 5.5 8.5 5.5c1.5 0 2.9.8 3.5 2.1.6-1.3 2-2.1 3.5-2.1 2.4 0 4.5 1.9 4.5 4.9C20 16.1 12 21 12 21z"/></svg>';
const petal = flower('currentColor', '#FFD36B');
const wave = (y, c) => `<path d="M2 ${y}q7.5-9 15 0t15 0 15 0 15 0" fill="none" stroke="${c}" stroke-width="4.5" stroke-linecap="round"/>`;

const P = [
  { name: 'Nhi cao', accent: '#FFD6A5',
    wish: 'Chúc Nhi cao mãi, không chỉ về chiều cao mà cả sự nghiệp với niềm vui nha!',
    icon: '<svg viewBox="0 0 64 64" aria-hidden="true"><g transform="rotate(-35 32 32)"><rect x="4" y="21" width="56" height="22" rx="5" fill="#FFE08A" stroke="#8A5A1F" stroke-width="2.5"/><path d="M14 21v9M22 21v6M30 21v9M38 21v6M46 21v9" stroke="#8A5A1F" stroke-width="2.5" stroke-linecap="round"/></g></svg>' },
  { name: 'Quyên cu', accent: '#FFB8D1',
    wish: 'Chúc Quyên cu luôn đáng yêu như nickname, tươi như hoa 20/10 luôn',
    icon: flower('#FF8FB1', '#FFD36B', '<path d="M32 44v17" stroke="#4FA36B" stroke-width="3.5" stroke-linecap="round"/><path d="M32 56c-9 0-13-4-13-9 9 0 13 4 13 9z" fill="#7BCB92"/>') },
  { name: 'Trang ốc', accent: '#D8C8FF',
    wish: 'Chúc Trang ốc chậm mà chắc, bình an và hạnh phúc trong vỏ ốc của mình',
    icon: '<svg viewBox="0 0 64 64" aria-hidden="true"><path d="M5 54c0-6 5-9 12-9h31c8 0 12 2 12 6 0 4-3 6-8 6H13c-5 0-8-1-8-3z" fill="#FFE5D3" stroke="#B5603A" stroke-width="2.5" stroke-linejoin="round"/><path d="M54 46V36M59 47l2-9" stroke="#B5603A" stroke-width="2.5" stroke-linecap="round"/><circle cx="54" cy="35" r="2.6" fill="#B5603A"/><circle cx="61" cy="37" r="2.6" fill="#B5603A"/><circle cx="28" cy="27" r="20" fill="#FFB98F" stroke="#B5603A" stroke-width="2.5"/><path d="M28 27a3 3 0 0 1 6 0 6 6 0 0 1-12 0 9 9 0 0 1 18 0 12 12 0 0 1-24 0" fill="none" stroke="#B5603A" stroke-width="2.5" stroke-linecap="round"/></svg>' },
  { name: 'Thư', accent: '#F3C6F0',
    wish: 'Chúc Thư xinh đẹp, mọi lời ước đều thành thư hồi âm thật đẹp',
    icon: '<svg viewBox="0 0 64 64" aria-hidden="true"><rect x="6" y="14" width="52" height="38" rx="6" fill="#fff" stroke="#7A5CC0" stroke-width="2.5"/><path d="M8 18l24 19 24-19" fill="none" stroke="#7A5CC0" stroke-width="2.5" stroke-linejoin="round" stroke-linecap="round"/><path d="M32 47s-8-4.8-8-9.6c0-2.5 2-4.1 4-4.1 1.6 0 3.2.9 4 2.3.8-1.4 2.4-2.3 4-2.3 2 0 4 1.6 4 4.1 0 4.8-8 9.6-8 9.6z" fill="#FF6F9F"/></svg>' },
  { name: 'Hải anh', accent: '#BDE4F5',
    wish: 'Chúc Hải anh mạnh mẽ như biển, rực rỡ như ánh bình minh',
    icon: `<svg viewBox="0 0 64 64" aria-hidden="true"><circle cx="32" cy="22" r="11" fill="#FFB347"/>${wave(36, '#3E9BD6')}${wave(45, '#6DB9E8')}${wave(54, '#9AD0F0')}</svg>` },
  { name: 'Mai hoa', accent: '#FFE59A',
    wish: 'Chúc Mai hoa nở đúng mùa, thơm ngát và được trân trọng như cái tên',
    icon: flower('#FFD23F', '#FF8A1F', '<path d="M8 60c10-3 18-8 22-16" stroke="#8B5A3C" stroke-width="3.5" fill="none" stroke-linecap="round"/><circle cx="13" cy="55" r="3.5" fill="#FFB020"/>') }
  { name:'Tâm Anh', accent: 'pink',
   wish: 'Chúc Tâm Anh luôn tươi cười, hạnh phúc và vui vẻ trong cuộc sống',
    icon: flower('#FFD23F', '#FF8A1F', '<path d="M8 60c10-3 18-8 22-16" stroke="#8B5A3C" stroke-width="3.5" fill="none" stroke-linecap="round"/><circle cx="13" cy="55" r="3.5" fill="#FFB020"/>') }
];

const $ = id => document.getElementById(id);
const rand = (a, b) => a + Math.random() * (b - a);
const tint = ['#FFB38A', '#FF8FB1', '#C9B3FF', '#FF9EC4'];
const [card, inner, layer, fx] = ['card', 'inner', 'layer', 'fx'].map($);
let on = !matchMedia('(prefers-reduced-motion: reduce)').matches;

const btns = P.map((p, i) => {
  const b = document.createElement('button');
  b.type = 'button';
  b.textContent = p.name;
  b.style.setProperty('--c', p.accent);
  b.setAttribute('aria-pressed', 'false');
  b.onclick = () => choose(i);
  return b;
});
$('names').append(...btns);

function swap(html) {
  inner.style.animation = 'none';
  void inner.offsetWidth;
  inner.innerHTML = html;
  inner.style.animation = '';
}

function choose(i) {
  const p = P[i];
  btns.forEach((b, j) => b.setAttribute('aria-pressed', j === i));
  card.style.setProperty('--accent', p.accent);
  swap(`<div class="ico">${p.icon}</div><h2 class="name"><span>${p.name}</span></h2><p class="wish">${p.wish}</p>`);
  rain();
}

function rain() {
  if (!on || layer.childElementCount > 36) return;
  for (let i = 0; i < 14; i++) {
    const e = document.createElement('i');
    e.innerHTML = i % 2 ? heart : petal;
    e.style.cssText = `--x:${rand(0, 94).toFixed(1)}%;--s:${rand(14, 26).toFixed(0)}px;--dx:${rand(-70, 70).toFixed(0)}px;--r:${rand(-240, 240).toFixed(0)}deg;--o:${rand(.35, .65).toFixed(2)};color:${tint[i % tint.length]};animation-duration:${rand(5, 8.5).toFixed(1)}s;animation-delay:${rand(0, 1.4).toFixed(1)}s`;
    e.onanimationend = () => e.remove();
    layer.append(e);
  }
}

function sync() {
  fx.setAttribute('aria-pressed', on);
  fx.lastElementChild.textContent = on ? 'Bật' : 'Tắt';
}
fx.onclick = () => {
  on = !on;
  sync();
  on ? rain() : layer.replaceChildren();
};

sync();
swap(`<div class="ico">${heart}</div><p class="hint">Chọn tên của bạn nha</p>`);
</script>
</body>
</html>
